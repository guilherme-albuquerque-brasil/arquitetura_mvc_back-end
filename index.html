<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Cadastro de Produtos - MVC</title>
</head>
<body>
<h1>Cadastro de Produtos</h1>
<form id="form-produto">
<input type="text" id="input-nome" placeholder="Nome do produto" required>
<input type="number" id="input-preco" placeholder="Preco" step="0.01" required>

</form>
<ul id="lista-produtos"></ul>
<script src="model.js"></script>
<script src="view.js"></script>
<script src="controller.js"></script>
</body>
</html>
